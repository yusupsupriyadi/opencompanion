# Publishes landing/ to GitHub Pages, https://yusupsupriyadi.github.io/opencompanion/, whenever it changes on main.
# The page is plain HTML with its assets beside it, so nothing is built: the folder goes out as it is.
name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the one going out instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing/
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v5
