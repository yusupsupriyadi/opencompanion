# OpenCompanion CI. Every job is off by default, so an ordinary push runs nothing and uses no
# credits. Start a run from "Trigger Pipeline" in CircleCI (or the API) and set the parameters
# for the jobs you want, for example macos: true. The steps themselves live in scripts/ci and
# e2e/linux, so they run the same way locally and on any CI.
version: 2.1

orbs:
  win: circleci/windows@5.0

parameters:
  linux:
    type: boolean
    default: false
  linux_e2e:
    type: boolean
    default: false
  windows:
    type: boolean
    default: false
  macos:
    type: boolean
    default: false

jobs:
  linux-checks:
    machine:
      image: ubuntu-2604:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Checks in Ubuntu 24.04 (Docker)
          command: bash e2e/linux/run.sh checks
          no_output_timeout: 30m
      - store_artifacts:
          path: e2e/linux/out

  linux-e2e:
    machine:
      image: ubuntu-2604:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build, install and drive the .deb (Docker, Xvfb, WebDriver)
          command: bash e2e/linux/run.sh e2e
          no_output_timeout: 30m
      - store_artifacts:
          path: e2e/linux/out

  windows-checks:
    executor: win/default
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-windows-{{ checksum "src-tauri/Cargo.lock" }}
      - run:
          # Node is pinned (jsdom needs ^24.15.0), whatever the image carries.
          name: Install Rust, Bun and Node.js 24.21.0
          shell: bash.exe
          command: |
            if ! command -v cargo > /dev/null; then
              curl -sSf -o rustup-init.exe https://win.rustup.rs/x86_64
              ./rustup-init.exe -y --profile minimal -c clippy
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup component add clippy
            command -v bun > /dev/null || powershell.exe -NoProfile -Command "irm bun.sh/install.ps1 | iex"
            curl -fsSL -o node.zip https://nodejs.org/dist/v24.21.0/node-v24.21.0-win-x64.zip
            powershell.exe -NoProfile -Command "Expand-Archive -Path node.zip -DestinationPath C:\node -Force"
            echo 'export PATH="/c/node/node-v24.21.0-win-x64:$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"' > "$HOME/ci-path.sh"
            . "$HOME/ci-path.sh" && node --version && bun --version && cargo --version
      - run:
          name: Checks
          shell: bash.exe
          command: |
            . "$HOME/ci-path.sh"
            bash scripts/ci/checks.sh
          no_output_timeout: 30m
      - save_cache:
          key: cargo-windows-{{ checksum "src-tauri/Cargo.lock" }}
          paths:
            - ~/.cargo/registry

  macos-checks:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-macos-{{ checksum "src-tauri/Cargo.lock" }}
      - run:
          # Node is pinned (jsdom needs ^24.15.0), whatever the image carries.
          name: Install Rust, Bun and Node.js 24.21.0
          command: |
            command -v cargo > /dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal -c clippy
            command -v bun > /dev/null || curl -fsSL https://bun.sh/install | bash
            curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-darwin-arm64.tar.gz | tar -xz -C "$HOME"
            echo 'export PATH="$HOME/node-v24.21.0-darwin-arm64/bin:$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/node-v24.21.0-darwin-arm64/bin:$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"
            rustup component add clippy
            node --version && bun --version && cargo --version
      - run:
          # cargo test compiles the app for macOS, which also reads tauri.macos.conf.json.
          name: Checks
          command: bash scripts/ci/checks.sh
          no_output_timeout: 30m
      - save_cache:
          key: cargo-macos-{{ checksum "src-tauri/Cargo.lock" }}
          paths:
            - ~/.cargo/registry

workflows:
  linux:
    when: << pipeline.parameters.linux >>
    jobs:
      - linux-checks
  linux-e2e:
    when: << pipeline.parameters.linux_e2e >>
    jobs:
      - linux-e2e
  windows:
    when: << pipeline.parameters.windows >>
    jobs:
      - windows-checks
  macos:
    when: << pipeline.parameters.macos >>
    jobs:
      - macos-checks
