[package]
name = "opencompanion"
version = "0.2.1"
description = "Local control room for AI coding CLIs"
authors = ["OpenCompanion"]
edition = "2021"
default-run = "opencompanion"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opencompanion_lib"
# Desktop links only the rlib. Tauri's template also builds `staticlib` (iOS) and `cdylib`
# (Android), and the static library alone is over 1 GB per debug build. Add them back for a mobile
# target.
crate-type = ["rlib"]

# The test stand-in CLI and the spike tool, with the integration tests that run fake-cli. They
# need `--features dev-tools`, so `tauri build` leaves them out of the installers.
[features]
dev-tools = []

[[bin]]
name = "fake-cli"
path = "src/bin/fake-cli.rs"
required-features = ["dev-tools"]

[[bin]]
name = "air-spike"
path = "src/bin/air-spike.rs"
required-features = ["dev-tools"]

[[test]]
name = "manager"
required-features = ["dev-tools"]

[[test]]
name = "companion"
required-features = ["dev-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# OSC 52 copies from a terminal, which arrive with no click behind them for the webview's clipboard.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
sysinfo = "0.39"
vt100 = "0.16"
which = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros", "time"] }
sha2 = "0.11"
local-ip-address = "0.6"
ureq = "3"
# Automations: cron schedules in the computer's local time.
croner = "4"
chrono = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Signals a CLI's whole process group when a session stops (`proc::kill_tree`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows toasts and Linux (D-Bus) notifications report a click, which opens the session
# (PRD FR-40). Already in the tree through tauri-plugin-notification.
[target.'cfg(not(any(target_os = "macos", target_os = "android", target_os = "ios")))'.dependencies]
notify-rust = "4.11"

# File and line numbers for panics and backtraces, without the full debug info that made
# `target/debug` grow by gigabytes. Set `debug = true` locally to inspect variables in a debugger.
[profile.dev]
debug = "line-tables-only"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
